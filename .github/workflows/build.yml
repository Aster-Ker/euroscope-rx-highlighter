name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write   # needed to attach the DLL to a release
    steps:
      - uses: actions/checkout@v4

      - name: Fetch EuroScope SDK
        shell: pwsh
        run: ./scripts/fetch-sdk.ps1

      - name: Configure (32-bit)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: RxHighlighter
          path: build/Release/RxHighlighter.dll

      - name: Attach DLL to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag.TrimStart('v')
          # The release tag must match the version compiled into the plug-in.
          if (-not (Select-String -Path src/Version.h -Pattern "RXH_VERSION_STRING `"$version`"" -Quiet)) {
            throw "Release $tag does not match RXH_VERSION_STRING in src/Version.h"
          }
          gh release upload $tag build/Release/RxHighlighter.dll --clobber --repo "${{ github.repository }}"
